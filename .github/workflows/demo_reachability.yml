name: demo-reachability
# One-off probe: which exchange demo APIs can GitHub-hosted runners reach?
on:
  push:
    branches: [claude/project-thread-p81umz]
    paths: [.github/workflows/demo_reachability.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe demo hosts
        run: |
          curl -sI --max-time 20 https://demo-futures.kraken.com/derivatives/api/v3/tickers | head -5
          for u in https://demo-futures.kraken.com/derivatives/api/v3/instruments https://demo-futures.kraken.com/api/charts/v1/trade/PF_XBTUSD/4h; do
            code=$(curl -sL -o /tmp/body -w "%{http_code} %{url_effective}" --max-time 20 "$u" || echo ERR)
            echo "$u -> $code $(head -c 160 /tmp/body 2>/dev/null)"
          done
