# Akis paper test (cards/akis.md): once a day, the frozen rules on the newest day in
# Binance's public archive (published a day late). No orders, no keys.
name: Akis paper test

on:
  schedule:
    - cron: "20 6 * * *"  # UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: akis-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pandas numpy
      - run: python research/forward/akis_paper.py
      - name: Save
        run: |
          git add forward/akis_paper || exit 0
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Akis paper: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
