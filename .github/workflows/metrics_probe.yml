# One-off research probe (no keys): does Bitget's public futures data match Binance's archive metrics?
name: Metrics probe (Akis)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - research/live/bitget_metrics_probe.py
      - .github/workflows/metrics_probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pandas
      - run: python research/live/bitget_metrics_probe.py
