# Runs Fitil Avcisi (cards/fitil_avcisi.md) on the Bitget DEMO account (play money) every 15 minutes.
# Started by the Cloudflare clock (telegram_worker/worker.js dueBots); GitHub's own cron is only a fallback.
# Keys live in GitHub Secrets, never in the repo. Without keys nothing is traded.
name: Fitil Avcisi Bitget demo

on:
  schedule:
    - cron: "5,20,35,50 * * * *"  # fallback if the Cloudflare clock is down
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/bitget_fitil.py
      - tests/test_bitget_fitil.py
      - scripts/bitget_demo.py
      - .github/workflows/bitget_demo_fitil.yml

permissions:
  contents: write

concurrency:
  group: bitget-demo-fitil
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_KEYS: ${{ secrets.BITGET_DEMO_API_KEY != '' && secrets.BITGET_DEMO_API_SECRET != '' && secrets.BITGET_DEMO_API_PASSPHRASE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-demo.txt
      - run: pip install -r requirements-demo.txt

      - name: Check (no keys)
        if: github.event_name == 'pull_request'
        run: |
          python -m pytest -q tests/test_bitget_fitil.py tests/test_bitget_demo.py
          python scripts/bitget_fitil.py --check

      - name: Trade on the Bitget demo account
        if: github.event_name != 'pull_request' && env.HAS_KEYS == 'true'
        env:
          BITGET_DEMO_API_KEY: ${{ secrets.BITGET_DEMO_API_KEY }}
          BITGET_DEMO_API_SECRET: ${{ secrets.BITGET_DEMO_API_SECRET }}
          BITGET_DEMO_API_PASSPHRASE: ${{ secrets.BITGET_DEMO_API_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
        run: python scripts/bitget_fitil.py

      - name: Save the trade log
        if: always() && github.event_name != 'pull_request' && env.HAS_KEYS == 'true'
        run: |
          if [ ! -d forward/bitget_fitil ]; then echo "no log yet"; exit 0; fi
          git add forward/bitget_fitil
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fitil demo log: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
