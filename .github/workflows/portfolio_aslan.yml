name: Portfolio - Aslan NAS trade list (research)
# Research only: writes the frozen Aslan NAS100 v2 1h trade list + NAS100 daily closes for the portfolio
# backtest and commits them to the PR branch (HistData is not reachable from the research container).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trades:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pyarrow histdata
      - uses: actions/cache/restore@v4
        with:
          path: user_data/forex1m
          key: forex-1m-${{ hashFiles('research/aslan_nasdaq/fetch_1m.py', 'research/forex/fetch_histdata.py') }}
          restore-keys: forex-1m-
      - run: python -u research/aslan_nasdaq/fetch_1m.py
      - run: python -u research/aslan_nasdaq/fetch_1m.py --holdout
      - run: python -u research/portfolio/aslan_nas_trades.py
      - name: Commit the CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/portfolio/data/aslan_nas_raw.csv research/portfolio/data/nas100_daily.csv
          git diff --cached --quiet || git commit -m "Portfolio: Aslan NAS trade list + NAS100 daily closes"
          git push
