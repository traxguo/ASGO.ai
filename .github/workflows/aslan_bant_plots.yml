name: Aslan bant charts (research)
# Research only: charts of a few tested trades of the Aslan band rule (research/aslan_5dk/plots_bant.py).
# Uses the HistData 5m cache of the index/forex batch (dev + val only, never committed), runs the test and
# commits the result CSVs back to the branch (the research container cannot download Actions artifacts).
on:
  push:
    branches: ["claude/**"]
    paths: ["research/aslan_5dk/plots_bant.py", ".github/workflows/aslan_bant_plots.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aslan-bant-plots-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pyarrow histdata numba matplotlib
      - uses: actions/cache/restore@v4
        with:
          path: user_data/efb5m
          key: efb-5m-${{ hashFiles('research/endeks_forex/fetch.py', 'research/forex/fetch_histdata.py') }}
      - run: python -u research/endeks_forex/fetch.py
      - uses: actions/cache/save@v4
        with:
          path: user_data/efb5m
          key: efb-5m-${{ hashFiles('research/endeks_forex/fetch.py', 'research/forex/fetch_histdata.py') }}
        continue-on-error: true  # the key already exists when the restore hit
      - name: Draw the trade charts
        run: python -u research/aslan_5dk/plots_bant.py
      - name: Commit the result CSVs
        run: |
          git add results/2026-11-19_aslan_bant/ornek/*.png
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aslan bant trade charts: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 7; done
          exit 1
