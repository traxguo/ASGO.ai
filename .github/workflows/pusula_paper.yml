# Pusula paper tracking (no money, no orders): frozen PusulaTrendLong and PusulaV2 on the 16-coin list
# from 2026-10-01, re-run once a day on public Binance archive data (research/forward/pusula_paper.py).
# Until 2026-11-05 this only ran when a Claude session started it by hand, so the log stopped on 2026-10-10.
name: Pusula paper tracking

on:
  schedule:
    - cron: "55 2 * * *"  # UTC, after Binance publishes yesterday's daily archive
  workflow_dispatch:
  pull_request:
    paths:
      - research/forward/pusula_paper.py
      - .github/workflows/pusula_paper.yml

permissions:
  contents: write

concurrency:
  group: pusula-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-demo.txt
      - run: pip install -r requirements-demo.txt
      - name: Data (Binance archive, a year of warm-up before 2026-10-01)
        run: |
          PAIRS=$(python -c "import json;print(' '.join(json.load(open('config/pairs_wide16.json'))['exchange']['pair_whitelist']))")
          python research/data/fetch_binance_vision.py --pairs $PAIRS --timeframes 1h 4h 1d --start 2025-10 --current-month
      - name: Paper test
        run: FT_LOCAL=1 FT_OFFLINE=1 python research/forward/pusula_paper.py
      - name: Save
        if: github.event_name != 'pull_request'
        run: |
          git add forward/pusula_kagit.md forward/pusula_kagit.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pusula paper log: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
