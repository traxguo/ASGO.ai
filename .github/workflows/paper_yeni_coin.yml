# Paper tracking of Yeni Coin Short, 14-day version (cards/yeni_coin_short.md) and the BTC-hedged 30-day variant
# (cards/yeni_coin_short_btc_hedge.md). No keys, no orders, no demo account.
# Reads Binance listings from data.binance.vision and Bitget public prices; writes forward/paper_yeni_coin/.
# Rules frozen until the 2026-11-30 review.
name: Yeni Coin Short paper tracking

on:
  schedule:
    - cron: "17 6,18 * * *"  # twice a day; the archive publishes yesterday's daily files in the morning (UTC)
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/paper_yeni_coin.py
      - tests/test_paper_yeni_coin.py
      - .github/workflows/paper_yeni_coin.yml

permissions:
  contents: write

concurrency:
  group: paper-yeni-coin
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-demo.txt
      - run: pip install -r requirements-demo.txt

      - name: Check (no keys, nothing saved)
        if: github.event_name == 'pull_request'
        run: |
          python -m pytest -q tests/test_paper_yeni_coin.py
          python scripts/paper_yeni_coin.py --check

      - name: Paper tracking (no orders, public prices)
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
        run: python scripts/paper_yeni_coin.py

      - name: Save the paper log
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ -d forward/paper_yeni_coin ]; then git add forward/paper_yeni_coin; fi
          if [ -d forward/paper_yeni_coin_hedge ]; then git add forward/paper_yeni_coin_hedge; fi
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Yeni Coin paper log: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
