# Deploys the Telegram command bot (telegram_worker/) to Cloudflare Workers and points Telegram at it.
# Needs GitHub Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# and GH_DISPATCH_TOKEN (starts telegram_command.yml, which uses the BITGET_DEMO_API_* secrets);
# TELEGRAM_GROUP_ID is optional. Owner steps: docs/telegram_cloudflare_kurulum.md
name: Telegram bot (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - telegram_worker/**
      - .github/workflows/telegram_worker.yml
  workflow_dispatch:
  pull_request:
    paths:
      - telegram_worker/**
      - .github/workflows/telegram_worker.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_KEYS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: node --test telegram_worker/worker.test.mjs

      - name: Keys missing
        if: github.event_name != 'pull_request' && env.HAS_KEYS != 'true'
        run: echo "::notice::Cloudflare or Telegram secrets are not set yet, nothing deployed (docs/telegram_cloudflare_kurulum.md)."

      - name: Webhook secret
        if: github.event_name != 'pull_request' && env.HAS_KEYS == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          s=$(printf '%s' "asgo-webhook-$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-48)
          echo "::add-mask::$s"
          echo "WEBHOOK_SECRET=$s" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare
        id: deploy
        if: github.event_name != 'pull_request' && env.HAS_KEYS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: telegram_worker
          # the bot no longer talks to Bitget itself; remove the keys older versions stored
          postCommands: |
            echo y | npx wrangler secret delete BITGET_DEMO_API_KEY || true
            echo y | npx wrangler secret delete BITGET_DEMO_API_SECRET || true
            echo y | npx wrangler secret delete BITGET_DEMO_API_PASSPHRASE || true
          secrets: |
            GH_DISPATCH_TOKEN
            TELEGRAM_CHAT_ID
            TELEGRAM_GROUP_ID
            WEBHOOK_SECRET
        env:
          # lets the bot start the "Telegram komutu" job ("none" until the owner adds it)
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN || 'none' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # optional: the one group the bot may answer in ("none" until the owner adds it)
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID || 'none' }}

      - name: Point Telegram at the worker
        if: github.event_name != 'pull_request' && env.HAS_KEYS == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$URL" ]; then echo "::error::Cloudflare gave no worker address (is the workers.dev subdomain set up?)"; exit 1; fi
          curl -sS --fail-with-body "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${URL}" \
            --data-urlencode "secret_token=${WEBHOOK_SECRET}" \
            --data-urlencode 'allowed_updates=["message"]' | sed 's/bot[0-9]*:[A-Za-z0-9_-]*//g'
          echo
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setMyCommands" \
            --data-urlencode 'commands=[{"command":"durum","description":"Bakiye ve açık işlemler"},{"command":"gecmis","description":"Son kapanan işlemler"},{"command":"fiyat","description":"Güncel fiyat, ör. /fiyat BTC"},{"command":"yorum","description":"Piyasa yorumu, ör. /yorum ETH"},{"command":"kapat","description":"Demo işlemini kapat, ör. /kapat NEAR"},{"command":"sor","description":"Yapay zekâya soru, ör. /sor merhaba"},{"command":"yardim","description":"Komut listesi"}]' > /dev/null
          echo "Telegram now sends messages to the worker."
          # delivery health: pending messages and Telegram's last error reaching the worker
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" \
            | jq '{pending: .result.pending_update_count, last_error: .result.last_error_message, last_error_date: .result.last_error_date}'
          # the worker's own answer to a plain GET (expects "ok")
          curl -sS "$URL"; echo
