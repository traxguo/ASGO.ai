name: Aslan NAS funnel and ablation (research)
# Research only: where candidate setups of the frozen AslanLiq2_1h (bias) rule die on NAS100, and the
# pre-registered one-filter-at-a-time ablation (results/2026-11-06_aslan_ablasyon). Dev + val only:
# no holdout data is downloaded or loaded.
on:
  pull_request:
    paths: ["research/aslan_nasdaq/funnel.py", "research/aslan_nasdaq/ablation.py", ".github/workflows/aslan_funnel.yml"]
  workflow_dispatch:
jobs:
  funnel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pyarrow histdata matplotlib
      - uses: actions/cache@v4
        with:
          path: user_data/forex1m
          key: forex-1m-${{ hashFiles('research/aslan_nasdaq/fetch_1m.py', 'research/forex/fetch_histdata.py') }}
          restore-keys: forex-1m-
      - run: python -u research/aslan_nasdaq/fetch_1m.py
      - run: python -u research/aslan_nasdaq/funnel.py --out funnel_out
      - run: python -u research/aslan_nasdaq/ablation.py | tee funnel_out/ablation.md
      - uses: actions/upload-artifact@v4
        with:
          name: aslan-funnel
          path: funnel_out
