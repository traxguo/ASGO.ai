# Usage: always go through scripts/ft.sh so the safety check runs first.
#   ./scripts/ft.sh backtesting --strategy TrendMA_B
services:
  freqtrade:
    build: .
    image: asgo-freqtrade:local
    container_name: asgo-freqtrade
    # The whole repo is mounted; configs, strategies and data live in it.
    volumes:
      - ./:/freqtrade/repo
    working_dir: /freqtrade/repo
    env_file:
      - path: .env
        required: false
    entrypoint: ["freqtrade"]
    command: ["--help"]

  # Telegram bot: answers only the owner's personal chat. Start: docker compose up -d telegram-bot
  telegram-bot:
    image: asgo-freqtrade:local
    build: .
    container_name: asgo-telegram-bot
    volumes:
      - ./:/freqtrade/repo
    working_dir: /freqtrade/repo
    env_file:
      - path: .env
        required: true
    entrypoint: ["python", "-m", "signals.dispatcher.bot"]
    command: ["run"]
    restart: unless-stopped
